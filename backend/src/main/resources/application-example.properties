spring.application.name=appointly-api
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/appointly?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=CHANGE_ME

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

app.jwt.secret=CHANGE_THIS_TO_A_LONG_RANDOM_SECRET_KEY_AT_LEAST_32_BYTES_LONG
app.jwt.expiration-ms=86400000

app.cors.allowed-origins=http://localhost:5173
